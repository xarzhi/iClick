name: Build MFC Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Visual Studio 编译组件 (包含 MFC)
      # 确保环境中安装了 C++ 编译工具和 MFC 库
      uses: microsoft/visual-studio-github-actions/.github/actions/setup-vs-components@main
      with:
        components: |
          Microsoft.VisualStudio.Component.VC.ATLMFC
          Microsoft.VisualStudio.Component.VC.Tools.x86.x64

    - name: 设置 MSBuild 环境
      uses: microsoft/setup-msbuild@v2

    - name: 还原 NuGet 包
      run: nuget restore iClick.sln

    - name: 编译项目
      shell: cmd
      run: |
        msbuild iClick.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143
        
    - name: 上传打包产物
      uses: actions/upload-artifact@v4
      with:
        name: iClick-Release-Binary
        # 建议检查你的项目输出目录，有些项目可能输出在 Release/ 或 iClick/Release/
        path: |
          Release/*.exe
          Release/*.dll